add_newline = false
format = "$python$golang$directory$git_branch$git_status$character"
command_timeout = 1000

[directory]
truncation_length = 0
truncate_to_repo = false

#https://www.nerdfonts.com/cheat-sheet

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[python]
symbol = "\uec39 "
format = '[\[${symbol}${version}\]]($style) '
style = "yellow"

[golang]
symbol = "\ue626 "
format = '[\[${symbol}${version}\]]($style) '
style = "yellow"
